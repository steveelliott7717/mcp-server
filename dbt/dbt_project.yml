name: mcp_analytics
version: "1.0.0"
config-version: 2

profile: mcp_analytics

model-paths:   ["models"]
seed-paths:    ["seeds"]
macro-paths:   ["macros"]
test-paths:    ["tests"]
analysis-paths: ["analyses"]
target-path:   "target"
clean-targets: ["target", "dbt_packages"]

models:
  mcp_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  mcp_analytics:
    +quote_columns: false
